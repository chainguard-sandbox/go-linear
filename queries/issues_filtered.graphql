query ListIssuesFiltered($first: Int, $after: String, $filter: IssueFilter, $sort: [IssueSortInput!]) {
  issues(first: $first, after: $after, filter: $filter, sort: $sort) {
    nodes {
      id
      identifier
      title
      description
      priority
      createdAt
      updatedAt
      number
      url
      trashed
      archivedAt
      completedAt
      slaBreachesAt
      slaStartedAt
      labels {
        nodes {
          id
          name
        }
      }
      state {
        id
        name
      }
      team {
        id
        name
        key
      }
      assignee {
        id
        name
        displayName
        email
      }
      creator {
        id
        name
        email
        displayName
      }
      botActor {
        id
        name
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
